[package]
name = "krb5"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust Kerberos 5: GSS-API acceptor and initiator, KDC client (AS/TGS, cross-realm referrals), keytabs, FILE/DIR/KCM credential caches, krb5.conf, RFC 3961/3962/8009 crypto and RFC 4121 Wrap/MIC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ddalton/krb5"
documentation = "https://docs.rs/krb5"
readme = "README.md"
keywords = ["kerberos", "krb5", "gssapi", "rpcsec_gss", "nfs"]
categories = ["authentication", "cryptography", "network-programming"]
exclude = ["/.github", "/fuzz"]

[dependencies]
aes = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
rand = "0.8"
thiserror = "1.0"
tracing = "0.1"
crypto-bigint = { version = "0.7.5", optional = true, default-features = false, features = ["alloc"] }
p256 = { version = "0.14", optional = true, default-features = false, features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14", optional = true, default-features = false, features = ["ecdh", "ecdsa"] }
p521 = { version = "0.14", optional = true, default-features = false, features = ["ecdh", "ecdsa"] }
zeroize = { version = "1", features = ["derive"] }
pbkdf2 = { version = "0.13", optional = true, default-features = false, features = ["hmac"] }
des = { version = "0.9", optional = true }
rc2 = { version = "0.9", optional = true }
tokio = { version = "1.38", optional = true, default-features = false, features = ["net", "time", "io-util"] }
# The DER layer and the RFC 4120 structures, shared with the KDC that produces what this crate
# accepts. One decoder for the octets a checksum covers is the point: a second copy is a second
# way to disagree with a peer about a ticket that is otherwise valid.
rrl-krb-common = { git = "https://github.com/alexey-vostrikov/rrl-krb-common", branch = "main" }

[features]
# PKINIT (RFC 4556), anonymous PKINIT (RFC 8062) and ECDH/ECDSA (RFC 5349):
# `krb5::pkinit`.
pkinit = ["spake-nist", "dep:crypto-bigint", "dep:des", "dep:rc2", "dep:pbkdf2"]
# SPAKE pre-authentication over the NIST curves P-256, P-384 and P-521
# (edwards25519, MIT's default, needs no feature).
spake-nist = ["dep:p256", "dep:p384", "dep:p521"]
# An async KDC client on tokio's sockets: `krb5::AsyncKdcClient`.
tokio = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
# Mark feature-gated items with the feature they need.
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
# Only for the differential test in `src/differential.rs`: it runs every crypto function of this
# crate and of `rrl-crypto` on the same inputs and compares the octets. The library itself does not
# depend on it — the fork stays self-contained, and the test is what keeps the two copies honest.
rrl-crypto = { git = "https://github.com/alexey-vostrikov/rrl-crypto", branch = "main" }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1.0"
tokio = { version = "1.38", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util"] }

[lints.rust]
# `cargo fuzz` builds with --cfg fuzzing (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
