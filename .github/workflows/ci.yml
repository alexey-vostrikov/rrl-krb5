name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab or `gh workflow run CI`. This repository is a fork, and a
  # fork's Actions are switched on after its first push — a commit pushed while they were off
  # never gets a run of its own, and without this the only way to see a green build is to push
  # another commit.
  workflow_dispatch:
jobs:
  test:
    # One toolchain, and it is the one `rust-version` declares. There used to be a matrix of
    # `1.85` and `stable`, and it could only ever be wrong: the dependencies this crate rests on
    # (`rrl-crypto`, `rrl-krb-common`) declare `rust-version = "1.99.1"`, so the 1.85 leg failed
    # before compiling anything, and cancel-on-failure took `stable` down with it — a red job that
    # reported no test result at all. A second leg is the right shape once the crate has a floor
    # it can test *and* a ceiling it supports; one pin is the honest shape while the floor is the
    # compiler everything is built with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # The pin has to agree with the manifest, or the leg silently tests something the crate does
      # not claim to support — which is exactly how the 1.85 leg survived as long as it did.
      - name: The toolchain matches rust-version
        run: |
          declared=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          echo "declared=$declared actual=$actual"
          test "$declared" = "$actual"
      - run: cargo test
      - run: cargo test --features spake-nist
      - run: cargo test --features pkinit
      - run: cargo test --features tokio
      - run: cargo test --all-features
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features spake-nist -- -D warnings
      - run: cargo clippy --all-targets --features pkinit -- -D warnings
      - run: cargo clippy --all-targets --features tokio -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
  fuzz:
    # Every fuzz target (fuzz/README.md) for 30 s from the seeds in
    # testdata/: a target that no longer builds, or a shallow crash. The
    # crashes found so far are replayed by `cargo test` (testdata/fuzz/).
    #
    # In an image, not on the runner's own toolchain, and that is the whole
    # point of `docker/fuzz.Dockerfile`: `cargo fuzz` needs a nightly, and the
    # nightly has to be *newer* than this crate's `rust-version` — `rrl-crypto`
    # and `rrl-krb-common` declare 1.99.1, so a nightly from before that
    # branched refuses to build them (`rustc 1.98.0-nightly is not supported
    # by the following packages`). Bumping the pin alone would fix it today and
    # break again on the next MSRV bump; the image asserts the ordering, so the
    # failure is a build step naming both versions instead of a compile error
    # in the middle of a fuzz target.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: rust:1.99.1-bullseye
      FUZZ_IMAGE: rrl-krb5-fuzz:bullseye
    steps:
      - uses: actions/checkout@v5
      - name: Build the toolchain image
        run: docker build -t "$IMAGE" -f docker/toolchain.Dockerfile .
      - name: Build the fuzz image
        run: docker build -t "$FUZZ_IMAGE" -f docker/fuzz.Dockerfile --build-arg "BASE=$IMAGE" .
      # Python on the runner, because `seed.py` only writes the corpus.
      - run: fuzz/seed.py
      - run: ./scripts/fuzz.sh build -O
      - run: |
          for t in $(./scripts/fuzz.sh list); do
            ./scripts/fuzz.sh run -O "$t" -- -max_total_time=30 -rss_limit_mb=4096 -max_len=16384
          done
  live-kdc:
    # The client against a real MIT KDC, and its GSS tokens against MIT's
    # own acceptor. Pinned: it depends on the distro's MIT krb5 and
    # python3-gssapi packages, so a new image is a deliberate upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MIT's KDC and the Python bindings
        # A retry, because the runner's resolver is not always there: this job failed twice on
        # `Temporary failure resolving 'azure.archive.ubuntu.com'` — the mirror in the runner's own
        # `/etc/apt/apt-mirrors.txt` — while `live-kdc-mit122`, which installs from the same
        # mirrors, passed on the same commit. `Acquire::Retries` covers a connection that
        # truncates; it does not cover a resolver that answers nothing, so the attempt is repeated
        # and the failure is reported only when every attempt has failed.
        run: |
          set -eu
          sudo -S -p '' apt-get update -qq
          for attempt in 1 2 3; do
            # Timeouts, not patience: with the resolver answering nothing every fetch waits out
            # apt's own default, which is minutes per file — three attempts cost half an hour and
            # still fail. Fifteen seconds per request and no inner retry makes a dead mirror a
            # one-minute verdict, which is what a retry loop is for.
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                 -o Acquire::Retries=1 \
                 -o Acquire::http::Timeout=15 \
                 -o Acquire::https::Timeout=15 \
                 --fix-missing \
                 krb5-kdc krb5-admin-server krb5-user krb5-pkinit krb5-otp python3-gssapi; then
              exit 0
            fi
            echo "apt-get install failed on attempt $attempt of 3; waiting" >&2
            sleep $((attempt * 20))
          done
          echo "apt-get install failed three times; the runner could not reach its mirror" >&2
          exit 1
      - run: scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cat "$RUNNER_TEMP/krb5test/test.env" >> "$GITHUB_ENV"
      # PKINIT and OTP must be set up here, not skipped.
      - run: test "$KRB5_TEST_PKINIT" = 1
      - run: test "$KRB5_TEST_OTP" = 1
      - run: cargo test --features pkinit,tokio --test kdc -- --nocapture
        env:
          # Also compare the DNS resolver with dig on public realms' records.
          KRB5_TEST_DNS: "1"
      # The PKINIT tests again with a P-256 KDC key: MIT's KDC signs with
      # ECDSA (labelled RSA before 1.22).
      - run: |
          kill $(cat "$KRB5_TEST_DIR/kdc.pid")  # the KDC and kadmind
          KRB5_TEST_PKINIT_EC_KDC=1 scripts/test-kdc.sh "$RUNNER_TEMP/krb5ec"
          set -a; . "$RUNNER_TEMP/krb5ec/test.env"; set +a
          cargo test --features pkinit --test kdc pkinit -- --nocapture
          kill $(cat "$KRB5_TEST_DIR/kdc.pid")  # the KDC and kadmind
          scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cargo build --example gss_client
      - run: KRB5_CONFIG="$KRB5_TEST_DIR/krb5.conf" scripts/mit-acceptor.py "$KRB5_TEST_DIR" target/debug/examples/gss_client
      # KCM caches against sssd-kcm, the Fedora/RHEL default, with MIT's
      # tools on the other side. (Heimdal's kcm is tested by hand: it
      # wants the same socket.)
      - run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sssd-kcm
          sudo systemctl start sssd-kcm.socket
          test -S /var/run/.heim_org.h5l.kcm-socket
      - run: cargo test --test kdc kcm_ -- --nocapture
        env:
          KRB5_TEST_KCM: "1"
  live-kdc-mit122:
    # ECDH PKINIT needs MIT 1.22, newer than Ubuntu's package: built from
    # the release tarball (checksum-pinned), cached between runs.
    runs-on: ubuntu-24.04
    env:
      MIT: /home/runner/mit-krb5-1.22.2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: mit
        with:
          path: /home/runner/mit-krb5-1.22.2
          key: mit-krb5-1.22.2-kdbtest-ubuntu-24.04
      - if: steps.mit.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bison libssl-dev
          cd "$RUNNER_TEMP"
          curl -sSfO https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
          echo "3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13  krb5-1.22.2.tar.gz" | sha256sum -c
          tar -xzf krb5-1.22.2.tar.gz
          cd krb5-1.22.2/src
          ./configure --prefix="$MIT" --disable-nls >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
          # MIT's test KDB module, which holds delegation rules for the
          # S4U2Proxy tests; make install leaves it out.
          cp plugins/kdb/test/test.so "$MIT/lib/krb5/plugins/kdb/"
      - run: |
          echo "$MIT/bin" >> "$GITHUB_PATH"
          echo "$MIT/sbin" >> "$GITHUB_PATH"
      - run: klist -V
      # MIT's GSS-API for the SPNEGO and channel-binding interop tests:
      # python-gssapi built against this MIT, not the distro's.
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/gss"
          "$RUNNER_TEMP/gss/bin/pip" install -q --no-binary gssapi gssapi==1.12.0
          echo "$RUNNER_TEMP/gss/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$MIT/lib" >> "$GITHUB_ENV"
      - run: |
          so=$(python3 -c 'import gssapi.raw.creds as c; print(c.__file__)')
          ldd "$so" | grep "$MIT/lib/libgssapi_krb5"
      - run: scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cat "$RUNNER_TEMP/krb5test/test.env" >> "$GITHUB_ENV"
      - run: test "$KRB5_TEST_PKINIT_ECDH" = 1
      - run: test "$KRB5_TEST_S4U_REALM" = S4U.TEST
      - run: command -v uuserver  # the user-to-user interop test's peer
      - run: test "$KRB5_TEST_OTP" = 1
      - run: cargo test --features pkinit,tokio --test kdc -- --nocapture
      - run: |
          kill $(cat "$KRB5_TEST_DIR/kdc.pid")  # the KDC and kadmind
          KRB5_TEST_PKINIT_EC_KDC=1 scripts/test-kdc.sh "$RUNNER_TEMP/krb5ec"
          set -a; . "$RUNNER_TEMP/krb5ec/test.env"; set +a
          cargo test --features pkinit --test kdc pkinit -- --nocapture
